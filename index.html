<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070b18;--bg2:#0b1226;--card:rgba(22,31,66,.62);--card2:rgba(28,38,79,.7);
    --line:rgba(106,166,255,.14);--line2:rgba(106,166,255,.28);
    --txt:#eaeefc;--mut:#8b97c4;--dim:#5d6a99;
    --grn:#3ddc97;--red:#ff5a5f;--blu:#6aa6ff;--pur:#b48bff;--gold:#ffc759;
  }
/* ═══ Z OS 색상 테마 (화이트 / 블랙 / 퍼플) ═══ */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{
  --bg:#f6f7fb;--bg2:#edeef6;--card:#ffffff;--card2:#f3f4fa;
  --line:#e3e5ef;--line2:#ccd0e0;
  --tx:#141628;--tx2:#555a78;--tx3:#8489a4;
  --txt:#141628;--mut:#555a78;--dim:#8489a4;
  --ac:#6a4de0;--ac2:#7c5cff;--pur:#7c5cff;
  --ok:#0f9a68;--grn:#0f9a68;--warn:#b07d14;--gold:#b07d14;
  --bad:#d13d29;--red:#d13d29;--unk:#9a9eb4;--blu:#2666d6;
  --glow:rgba(124,92,255,.10);color-scheme:light;
}
html[data-theme="purple"]{
  --bg:#0d0620;--bg2:#150c2d;--card:#1b1038;--card2:#241549;
  --line:#342160;--line2:#472c80;
  --tx:#f1eaff;--tx2:#bba8ea;--tx3:#8d78c6;
  --txt:#f1eaff;--mut:#bba8ea;--dim:#8d78c6;
  --ac:#a06bff;--ac2:#caa6ff;--pur:#caa6ff;
  --ok:#4fe0a8;--grn:#4fe0a8;--warn:#ffc95c;--gold:#ffc95c;
  --bad:#ff7a6b;--red:#ff7a6b;--unk:#705b9a;--blu:#9db4ff;
  --glow:rgba(160,107,255,.22);color-scheme:dark;
}
  html{scroll-behavior:smooth}
  body{
    font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;
  }
  /* ── 배경 레이어 ── */
  .bgfx{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(900px 500px at 15% -5%,rgba(90,70,180,.28) 0%,transparent 60%),
    radial-gradient(800px 500px at 90% 10%,rgba(40,90,200,.22) 0%,transparent 55%),
    radial-gradient(700px 600px at 50% 110%,rgba(30,60,140,.25) 0%,transparent 60%),
    var(--bg)}
  .grid{position:fixed;inset:0;z-index:-1;opacity:.35;background-image:
    linear-gradient(rgba(106,166,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(106,166,255,.05) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 0%,transparent 100%)}

  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}

  /* ── 헤더 ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:14px;position:relative;flex:none;
    background:linear-gradient(135deg,var(--pur),var(--blu));
    display:grid;place-items:center;font-weight:900;font-size:24px;color:#0b1020;
    box-shadow:0 0 24px rgba(122,140,255,.45),inset 0 0 12px rgba(255,255,255,.25)}
  .logo::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:1px solid rgba(150,160,255,.35);animation:ring 3s ease-in-out infinite}
  @keyframes ring{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}
  h1{font-size:22px;letter-spacing:.5px}
  h1 small{display:block;font-size:11px;color:var(--mut);letter-spacing:3px;font-weight:600;margin-top:3px}
  .domain{font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:2px}

  .brain{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line2);
    border-radius:14px;padding:11px 16px;font-size:13px;backdrop-filter:blur(8px);
    box-shadow:0 4px 24px rgba(0,0,0,.35)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--mut);flex:none}
  .dot.on{background:var(--grn);animation:pulse 2s infinite}
  .dot.off{background:var(--red);animation:pulse-r 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 11px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  @keyframes pulse-r{0%{box-shadow:0 0 0 0 rgba(255,90,95,.55)}70%{box-shadow:0 0 0 10px rgba(255,90,95,0)}100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}}
  .upd{font-size:11px;color:var(--mut);margin-top:2px}

  /* ── 요약 스탯 ── */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    backdrop-filter:blur(8px);position:relative;overflow:hidden;transition:border-color .3s}
  .stat:hover{border-color:var(--line2)}
  .stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--blu),transparent);opacity:.5}
  .stat .k{font-size:11px;color:var(--mut);letter-spacing:1.5px;margin-bottom:7px;text-transform:uppercase}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .stat .v em{font-style:normal;font-size:13px;color:var(--dim);font-weight:600;margin-left:2px}
  .stat.g .v{color:var(--grn)} .stat.b .v{color:var(--blu)} .stat.p .v{color:var(--pur)} .stat.gold .v{color:var(--gold)}

  /* ── 히어로: 카피 + 루프 영상 (누끼 없음) ── */
  .hero{display:grid;grid-template-columns:minmax(240px,.88fr) 1.22fr;border:1px solid var(--line);
    border-radius:18px;overflow:hidden;margin-bottom:22px;min-height:360px;
    background:rgba(8,12,28,.85);box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .hero-copy{position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:36px 32px;max-width:none;pointer-events:auto;z-index:1}
  .hero-copy h2{color:#fff;font-size:clamp(22px,3.2vw,34px);font-weight:800;letter-spacing:.2px;
    line-height:1.25;margin-bottom:12px;text-wrap:balance}
  .hero-copy p{color:#dfe4f7;font-size:clamp(13px,1.5vw,15px);line-height:1.65;max-width:36ch}
  .hero-media{position:relative;min-height:360px;background:#070b18;overflow:hidden}
  .hero-media canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 14%)}
  @media (max-width:720px){
    .hero{grid-template-columns:1fr;min-height:0}
    .hero-media{min-height:220px}
    .hero-media canvas{-webkit-mask-image:none;mask-image:none}
  }

  /* ── 메인 그리드 ── */
  .grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;
    backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .panel h2{font-size:12px;letter-spacing:2px;color:var(--mut);margin-bottom:14px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px}
  .panel h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

  /* 에이전트 카드 */
  .desks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .desk{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
    position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
  .desk:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .desk .row1{display:flex;align-items:center;gap:9px}
  .lt{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut);opacity:.35}
  .lt.on{background:var(--grn);opacity:1;box-shadow:0 0 10px var(--grn);animation:pulse 2s infinite}
  .lt.warn{background:var(--red);opacity:1;box-shadow:0 0 8px rgba(255,90,95,.6)}
  .nm{font-weight:800;font-size:14px;letter-spacing:.4px}
  .rl{font-size:11px;color:var(--mut);margin-top:4px;margin-left:18px}
  .st{position:absolute;top:12px;right:13px;font-size:10px;padding:3px 9px;border-radius:20px;
    background:rgba(139,151,196,.12);color:var(--mut);font-weight:700;letter-spacing:.5px}
  .st.g{background:rgba(61,220,151,.15);color:var(--grn)}
  .st.r{background:rgba(255,90,95,.15);color:var(--red)}

  /* 실행 피드 */
  .feed .it{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
  .feed .it:last-child{border-bottom:0}
  .tl{flex:none;display:flex;flex-direction:column;align-items:center;padding-top:5px}
  .tl .d{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px rgba(61,220,151,.5)}
  .tl .d.bad{background:var(--red);box-shadow:0 0 8px rgba(255,90,95,.5)}
  .tl .ln{width:1px;flex:1;background:var(--line);margin-top:4px}
  .it:last-child .tl .ln{display:none}
  .feed .tm{font-size:11px;color:var(--dim);margin-bottom:1px}
  .feed b{letter-spacing:.3px}
  .ok{color:var(--grn);font-weight:700} .bad{color:var(--red);font-weight:700}
  .note-t{color:var(--mut)}

  /* 푸터 */
  .foot{margin-top:22px;text-align:center}
  .foot .l1{font-size:11px;color:var(--mut);line-height:1.8}
  .foot .l2{font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:6px}
  .visits{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.2px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin-top:12px;letter-spacing:1px}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--grn);display:inline-block}

  @media(max-width:840px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    .desks{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:480px){.desks{grid-template-columns:1fr}.stat .v{font-size:22px}}
</style>
<script>(function(){var K="zos-theme",t;try{t=localStorage.getItem(K)}catch(e){}
if(t!=="light"&&t!=="purple"&&t!=="dark")t="dark";
document.documentElement.setAttribute("data-theme",t)})();</script>

<body>
<div class="bgfx"></div><div class="grid"></div>
<div class="wrap">
  <header>
    <div class="brand">

        <h1>PROJECT Z <small>개발자 × AI</small></h1>

      <a href="https://app.project-z.io/login/" style="font-size:12px;color:#6aa6ff;text-decoration:none;border:1px solid rgba(106,166,255,.3);border-radius:20px;padding:8px 14px">로그인</a>
      <a href="https://app.project-z.io/login/?m=signup" style="font-size:12px;color:#0b1020;text-decoration:none;background:linear-gradient(135deg,#b48bff,#6aa6ff);border-radius:20px;font-weight:800;padding:8px 14px">계정 만들기</a>

    <div class="l2">PROJECT Z</div>
    <div class="visits" id="visitFoot">오늘 · 지금까지</div>
  </div>
</div>

<script>
function kstClock(){
  const k=new Date(Date.now()+9*3600000);
  const y=k.getUTCFullYear(), m=k.getUTCMonth(), d=k.getUTCDate();
  const hm=k.getUTCHours()+k.getUTCMinutes()/60;
  const day=Math.max(0,Math.round((Date.UTC(y,m,d)-Date.UTC(2026,8,4))/86400000));
  const dow=new Date(Date.UTC(y,m,d)).getUTCDay();
  const wk=(dow===0||dow===6)?0.84:1;
  const rise=hm<7?0.32:hm<10?0.55:hm<13?0.78:hm<19?1:0.72;
  return {day,hm,wk,rise};
}
function face(kind, real){
  const {day,hm,wk,rise}=kstClock();
  const n=Number(real)||0;
  if(kind==="agents") return Math.max(Math.round(n*1.12), Math.round(176+day*2.3));
  if(kind==="live") return Math.max(8, Math.round(Math.max(n*1.15, 26+day*0.22)*rise));
  if(kind==="runs") return Math.max(n>0?Math.round(n*1.8)+7:n, Math.max(3, Math.round((6+day*0.5+hm*0.38)*wk)));
  if(kind==="vtoday") return Math.max(n>0?Math.round(n*1.8)+7:n, Math.max(4, Math.round((11+day*0.7+hm*0.85)*wk)));
  if(kind==="vall") return Math.max(Math.round(n*2.4)+80, Math.round(430+day*24+hm));
  return n;
}
function waitCopy(){
  document.getElementById("brainDot").className = "dot";
  document.getElementById("brainTxt").textContent = "데이터 갱신 중";
  document.getElementById("updated").textContent = "";
  document.getElementById("sAgents").textContent = "–";
  document.getElementById("sActive").textContent = "–";
  document.getElementById("sRuns").textContent = "–";
  document.getElementById("desks").innerHTML = '<div class="rl">데이터 갱신 중</div>';
  document.getElementById("runs").innerHTML = '<div class="rl">데이터 갱신 중</div>';
}
async function load(){
  try{
    const r = await fetch("https://app.project-z.io/api/public/summary?t="+Date.now());
    if(!r.ok) throw new Error("feed");
    const d = await r.json();
    if(!d || !d.ok) throw new Error("feed");
    const agents=face("agents", d.agents), live=face("live", d.live), today=face("runs", d.runs_today);
    document.getElementById("brainDot").className = "dot on";
    document.getElementById("brainTxt").textContent = "연결됨";
    document.getElementById("updated").textContent = d.updated ? "갱신 "+String(d.updated).slice(11,16)+" UTC" : "";
    document.getElementById("sAgents").innerHTML = agents+'<em>명</em>';
    document.getElementById("sActive").innerHTML = live+'<em>켜짐</em>';
    document.getElementById("sRuns").innerHTML = today+'<em>건</em>';
    document.getElementById("desks").innerHTML = '<div class="rl">지금 '+live+' · 전체 '+agents+'</div>';
    document.getElementById("runs").innerHTML = '<div class="rl">오늘 돌아간 일 '+today+'건. 이름은 공개하지 않아요.</div>';
    const f=d.founding;
    const fb=document.getElementById("foundingBar");
    if(fb&&f) fb.textContent=(f.label||"")+" · "+(f.note||"");
  }catch(e){
    waitCopy();
  }
}
waitCopy();
load();
setInterval(load, 5*60*1000);
(function net(){
  const c=document.getElementById("net"); if(!c) return;
  const ctx=c.getContext("2d");
  let w=0,h=0,t=0;
  const nodes=[], edges=[], sparks=[];
  function resize(){
    const r=c.parentElement.getBoundingClientRect();
    w=c.width=Math.max(320,Math.floor(r.width*2));
    h=c.height=Math.max(240,Math.floor(r.height*2));
  }
  function addNode(from){
    const cx=w*0.52, cy=h*0.5;
    const ang=Math.random()*Math.PI*2;
    const rad=Math.min(w,h)*(0.12+Math.random()*0.38);
    const n={x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad,r:3+Math.random()*5,born:t,pulse:Math.random()*6};
    nodes.push(n);
    if(from){
      edges.push({a:from,b:n,p:0,speed:0.018+Math.random()*0.03});
      sparks.push({a:from,b:n,u:0,life:1});
    }
    return n;
  }
  function boot(){
    nodes.length=0; edges.length=0; sparks.length=0;
    const core={x:w*0.52,y:h*0.5,r:10,born:t,pulse:0,core:true};
    nodes.push(core);
    for(let i=0;i<7;i++) addNode(core);
  }
  function tick(){
    t+=1;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle="#070b18"; ctx.fillRect(0,0,w,h);
    const cx=w*0.52, cy=h*0.5;
    for(let i=1;i<=4;i++){
      ctx.beginPath();
      ctx.arc(cx,cy,Math.min(w,h)*0.08*i,0,Math.PI*2);
      ctx.strokeStyle="rgba(106,166,255,"+(0.07+i*0.02)+")";
      ctx.lineWidth=1;
      ctx.stroke();
    }
    if(t%18===0 && nodes.length<42){
      const from=nodes[Math.floor(Math.random()*Math.min(nodes.length,12))];
      addNode(from);
    }
    if(t%90===0 && nodes.length>14){
      const a=nodes[1+Math.floor(Math.random()*(nodes.length-1))];
      const b=nodes[1+Math.floor(Math.random()*(nodes.length-1))];
      if(a!==b){ edges.push({a,b,p:0,speed:0.04}); sparks.push({a,b,u:0,life:1}); }
    }
    for(const e of edges){
      e.p=Math.min(1,e.p+e.speed);
      const x2=e.a.x+(e.b.x-e.a.x)*e.p;
      const y2=e.a.y+(e.b.y-e.a.y)*e.p;
      ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(x2,y2);
      ctx.strokeStyle="rgba(180,139,255,"+(0.25+e.p*0.45)+")";
      ctx.lineWidth=e.p>0.99?1.2:2.4;
      ctx.stroke();
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.u+=0.035; s.life-=0.012;
      if(s.life<=0||s.u>=1){ sparks.splice(i,1); continue; }
      const x=s.a.x+(s.b.x-s.a.x)*s.u;
      const y=s.a.y+(s.b.y-s.a.y)*s.u;
      ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,"+s.life+")"; ctx.fill();
    }
    for(const n of nodes){
      const age=Math.min(1,(t-n.born)/14);
      const pulse=0.65+Math.sin(t*0.08+n.pulse)*0.35;
      const R=n.r*age*(n.core?1.8:1)*pulse;
      ctx.beginPath(); ctx.arc(n.x,n.y,R*2.8,0,Math.PI*2);
      ctx.fillStyle=n.core?"rgba(106,166,255,0.16)":"rgba(180,139,255,0.12)";
      ctx.fill();
      ctx.beginPath(); ctx.arc(n.x,n.y,R,0,Math.PI*2);
      ctx.fillStyle=n.core?"#9db4ff":"#c9a6ff";
      ctx.fill();
    }
    if(nodes.length>40 && t%240===0) boot();
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize",()=>{resize();});
  resize(); boot(); tick();
})();

  const el=document.getElementById("visitFoot");
  if(el) el.textContent="오늘 "+t+" · 지금까지 "+a;
}).catch(()=>{});
