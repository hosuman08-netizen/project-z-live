<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커뮤 — PROJECT Z</title>
<meta name="theme-color" content="#0b1020">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b18;--card:rgba(22,31,66,.62);--line:rgba(106,166,255,.14);--txt:#eaeefc;--mut:#8b97c4;--dim:#5d6a99;--blu:#6aa6ff;--pur:#b48bff}
html{color-scheme:dark}
body{min-height:100vh;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--txt)}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 420px at 20% -10%,rgba(90,70,180,.28),transparent 60%),var(--bg)}
.top{max-width:760px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#caa6ff,#6aa6ff);display:grid;place-items:center;font-weight:800;color:#0b1020}
.top a{margin-left:auto;color:#0b1020;text-decoration:none;font-size:13px;font-weight:800;background:linear-gradient(135deg,#b48bff,#6aa6ff);padding:8px 14px;border-radius:20px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
h1{font-size:22px;font-weight:800}
.sub{color:var(--mut);margin:6px 0 18px;font-size:14px}
.rooms{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.rooms button{font:650 13px/1 inherit;border:1px solid var(--line);background:transparent;color:var(--mut);padding:10px 14px;border-radius:999px;cursor:pointer}
.rooms button.on{border-color:var(--pur);color:#fff;background:rgba(180,139,255,.16)}
.post{border-top:1px solid var(--line);padding:16px 0}
.post b{color:var(--blu)}
.post .body{margin-top:8px;white-space:pre-wrap}
.post .meta{font-size:12px;color:var(--dim);margin-top:8px}
.empty{color:var(--mut);padding:36px 0}
.note{margin-top:24px;font-size:13px;color:var(--mut)}
.note a{color:var(--blu)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="top">
  <a href="/" class="logo" style="margin:0;padding:0;background:linear-gradient(160deg,#caa6ff,#6aa6ff);width:36px;height:36px;display:grid;place-items:center">Z</a>
  <div><b>커뮤</b><div style="font-size:12px;color:var(--dim)">로그인 없이 볼 수 있어요</div></div>
  <a href="https://app.project-z.io/login/?to=feed">들어가서 한 줄</a>
</div>
<div class="wrap">
  <h1>이야기</h1>
  <p class="sub">올린 글만 보여요. 쓰려면 들어가면 됩니다.</p>
  <div class="rooms" id="rooms"></div>
  <div id="feed"><p class="empty">불러오는 중…</p></div>
  <p class="note"><a href="/">메인</a> · <a href="https://app.project-z.io/login/?to=feed">한 줄 쓰려면 들어가기</a></p>
</div>
<script>
const API="https://app.project-z.io/api/public/feed";
const ROOMS=[["","전체"],["plaza","광장"],["shipped","오늘 남긴 것"],["news","소식"],["dev","개발자 소식"],["ai","AI 소식"],["help","도움"],["show","보여주기"],["ask","물어보기"]];
let room="";
const roomsEl=document.getElementById("rooms");
const feedEl=document.getElementById("feed");
function paintRooms(){
  roomsEl.innerHTML=ROOMS.map(([id,lab])=>`<button type="button" class="${room===id?"on":""}" data-r="${id}">${lab}</button>`).join("");
}
roomsEl.onclick=e=>{
  const b=e.target.closest("button[data-r]"); if(!b) return;
  room=b.dataset.r||"";
  paintRooms(); load();
};
async function load(){
  const q=room?("?room="+encodeURIComponent(room)):"";
  const d=await fetch(API+q).then(r=>r.json()).catch(()=>({}));
  const posts=d.posts||[];
  feedEl.innerHTML=posts.length?posts.map(p=>`<article class="post"><b>@${esc(p.handle)}</b><div class="body">${esc(p.body)}</div><div class="meta">${esc(lab(p.room))} · ${rel(p.created_at)}</div></article>`).join(""):`<p class="empty">이 칸은 아직 비어 있어요. 들어가면 첫 줄을 쓸 수 있어요.</p>`;
}
function lab(r){return (ROOMS.find(x=>x[0]===r)||["","광장"])[1]}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rel(t){const d=Date.now()-new Date(t).getTime(); if(d<6e4)return "방금"; if(d<36e5)return Math.floor(d/6e4)+"분 전"; if(d<864e5)return Math.floor(d/36e5)+"시간 전"; return Math.floor(d/864e5)+"일 전"}
paintRooms(); load();
</script>
</body>
</html>
